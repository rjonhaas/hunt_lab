# /etc/scada/water_treatment.conf
# Hunt Lab water-treatment HMI — process configuration (LAB SIMULATOR).
#
# Real ICS configs look approximately like this: tagged process variables,
# setpoint targets, alarm thresholds, controller references. The actual
# values here are fabricated; the structure matches what an attacker who
# successfully SSH'd into a Linux-based HMI might exfiltrate.

[plant]
plant_id              = HL-WTP-01
plant_name            = "Hunt Lab Water Treatment Plant"
operator              = "City of Hunt Lab Utilities"
operating_mode        = automatic

[controllers]
# Modbus TCP controllers on the OT subnet
chlorination_plc      = 192.168.99.10:502
ph_controller         = 192.168.99.11:502
turbidity_meter       = 192.168.99.12:502
flow_meter_intake     = 192.168.99.13:502
flow_meter_treated    = 192.168.99.14:502

[setpoints]
# Active operator setpoints — DO NOT MODIFY without supervisor sign-off
free_chlorine_target_ppm   = 1.20
free_chlorine_min_ppm      = 0.20
free_chlorine_max_ppm      = 4.00
ph_target                  = 7.40
ph_alarm_low               = 6.50
ph_alarm_high              = 8.50
turbidity_max_ntu          = 0.30
flow_rate_target_mgd       = 12.50

[alarms]
high_chlorine_action       = "operator_intervention"
low_chlorine_action        = "increase_dose_5pct"
ph_excursion_action        = "alarm_only"
flow_failure_action        = "switch_to_backup_intake"

[scheduled_doses]
# Chlorine injection schedule (kg/hour during peak demand)
peak_hours_06_10           = 18.5
peak_hours_17_21           = 22.0
off_peak                   = 12.0
overnight_22_05            = 9.5

