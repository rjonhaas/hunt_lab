# docker-compose.yml
# Single-server Docker deployment of the Threat Hunting Lab.
# Runs Elasticsearch, Kibana, Fleet Server, MITRE Caldera, LocalStack,
# and Filebeat on one Ubuntu host.
#
# Usage:
#   cp .env.example .env   # edit passwords/token
#   docker compose up -d
#   docker compose logs -f bootstrap   # watch first-run setup
#
# The Windows VMs (win-dc, win-server, win11-victim) still need to be
# provisioned separately with Vagrant, pointing at this host's IP for Fleet
# enrollment.

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  hunt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  esdata:
  kibana_data:
  caldera_data:
  localstack_data:
  velociraptor_data:
  ot_hmi_logs:

services:

  # ── Elasticsearch ───────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.14}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - cluster.name=hunt-lab
      - node.name=elasticsearch
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}
      - path.data=/usr/share/elasticsearch/data
      - path.logs=/usr/share/elasticsearch/logs
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      hunt_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Kibana ──────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.19.14}
    container_name: kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_NAME=hunt-lab-kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD is required}
      - XPACK_FLEET_ENABLED=true
      - XPACK_FLEET_PACKAGES=[{"name":"fleet_server","version":"latest"},{"name":"system","version":"latest"},{"name":"elastic_agent","version":"latest"},{"name":"windows","version":"latest"}]
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=hunt_lab_kibana_saved_objects_key_2026
    ports:
      - "5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
    networks:
      hunt_net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:5601/api/status | grep -q 'available'"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 90s

  # ── Bootstrap (one-shot) ────────────────────────────────────────────────────
  # Runs once after Elasticsearch + Kibana are healthy:
  #   - Resets kibana_system password
  #   - Creates Fleet Server service token
  #   - Configures Fleet outputs / policies
  #   - Fetches Windows enrollment token → writes to repo root fleet-enrollment-token.txt
  #   - Patches HOST_IP into docker/config/caldera/local.yml
  # Exits 0 on success; a non-zero exit is surfaced by `docker compose logs bootstrap`.
  bootstrap:
    image: python:3.11-slim
    container_name: bootstrap
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - HOST_IP=${HOST_IP:?HOST_IP is required — set to the Windows host LAN IP}
      - ELASTIC_VERSION=${ELASTIC_VERSION:-8.19.14}
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ../:/workspace         # repo root — reads docker/.env, writes fleet-enrollment-token.txt
    entrypoint: ["bash", "-c"]
    command:
      - |
        command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq curl; }
        exec bash /bootstrap/bootstrap.sh
    networks:
      - hunt_net

  # ── Fleet Server ────────────────────────────────────────────────────────────
  # Depends on bootstrap having written the service token.
  # The service token is passed in via FLEET_SERVER_SERVICE_TOKEN env var, which
  # is set from the .env file (bootstrap.sh writes it there after creation).
  fleet-server:
    image: docker.elastic.co/beats/elastic-agent:${ELASTIC_VERSION:-8.19.14}
    container_name: fleet-server
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_INSECURE_HTTP=true
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - "FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN:-}"
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - KIBANA_FLEET_HOST=http://kibana:5601
      - FLEET_INSECURE=true
    ports:
      - "8220:8220"
    networks:
      hunt_net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status | grep -q 'HEALTHY'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── MITRE Caldera ───────────────────────────────────────────────────────────
  caldera:
    build:
      context: .
      dockerfile: Dockerfile.caldera
    image: hunt-lab/caldera:local
    container_name: caldera
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "7010:7010"
      - "7011:7011/udp"
      - "7012:7012"
    volumes:
      - ./config/caldera/local.yml:/usr/src/app/conf/local.yml:ro
      - caldera_data:/usr/src/app/data
    networks:
      hunt_net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "KEY: ADMIN123", "http://localhost:8888/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── LocalStack ──────────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:${LOCALSTACK_VERSION:-3.4}
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3,iam,lambda,sts,cloudwatch,ec2
      - DEFAULT_REGION=us-east-1
      - EAGER_SERVICE_LOADING=1
      - DEBUG=0
      - LS_LOG=info  # cloudtrail-gen tailer parses 'AWS service.Op => status' lines from this stream
      - DATA_DIR=/var/lib/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      hunt_net:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── CloudTrail tailer ──────────────────────────────────────────────────────
  # Seeds baseline AWS resources once (S3 buckets, IAM users, sample objects),
  # then tails LocalStack's stdout via the Docker engine API and writes a
  # CloudTrail-formatted JSON event per real API call into ./cloudtrail/.
  # Filebeat picks the events up from that shared volume.
  #
  # Net effect: any AWS API hit against LocalStack — by the seed step, by
  # Caldera abilities (rclone S3 exfil, future IAM scenarios), or by anything
  # else the user runs — produces a real CloudTrail event in
  # logs-aws.cloudtrail-*. No more synthetic noise.
  cloudtrail-gen:
    image: python:3.11-slim
    container_name: cloudtrail-gen
    restart: unless-stopped
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - LOCALSTACK_CONTAINER=localstack
      - CLOUDTRAIL_LOG_DIR=/cloudtrail
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - ./cloudtrail:/cloudtrail
      - ./bootstrap/generate_cloudtrail_activity.sh:/seed.sh:ro
      - ./bootstrap/cloudtrail_tailer.py:/tailer.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq curl; }
        pip install --no-cache-dir -q awscli-local awscli docker
        # Tailer attaches first so it catches the seed's API calls; seed
        # runs after a short delay in the background. Tailer stays in
        # the foreground as the container's main process.
        ( sleep 5 && bash /seed.sh ) &
        exec python3 -u /tailer.py
    networks:
      - hunt_net

  # ── ot-hmi (water-treatment HMI simulator for the ot_brute scenario) ────────
  # Linux container with OpenSSH + a deliberately weak operator account,
  # writing auth.log to a shared volume that filebeat picks up. Caldera's
  # ot_brute adversary SSH-brute-forces this host from a Windows agent;
  # filebeat ships the failed/accepted SSH events to Elastic as
  # event.dataset: ot-hmi.auth. The detection rule in
  # kibana/detection_rules/ot_brute.ndjson fires on the brute-force pattern.
  # Sized so SIFTics's Safety Officer persona has an OT/ICS target it can
  # recognise from the hostname + the dumped /etc/scada config — the
  # demonstrable scenario for G16 (personnel_safety hard_stop).
  ot-hmi:
    build:
      context: .
      dockerfile: Dockerfile.ot-hmi
    image: hunt-lab/ot-hmi:local
    container_name: ot-hmi-water-01
    hostname: ot-hmi-water-01
    restart: unless-stopped
    volumes:
      - ot_hmi_logs:/var/log
    networks:
      hunt_net:
        ipv4_address: 172.20.0.60
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "hunt-lab.role=ot-hmi"
      - "hunt-lab.scenario=ot_brute"

  # ── Filebeat ────────────────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.14}
    container_name: filebeat
    user: root
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./cloudtrail:/var/log/localstack/cloudtrail:ro
      # Same volume the ot-hmi simulator writes its auth.log into — mounted
      # read-only here so filebeat can ship the SSH brute-force evidence to
      # Elastic (see filebeat.yml input for /var/log/ot-hmi/auth.log).
      - ot_hmi_logs:/var/log/ot-hmi:ro
    command: ["filebeat", "-e", "--strict.perms=false"]
    networks:
      - hunt_net

  # ── Velociraptor (DFIR endpoint visibility) ──────────────────────────────────
  # Single-node Velociraptor server (weslambert/velociraptor-docker image).
  # On first start it generates server.config.yaml, creates the admin user from
  # VELOX_USER/VELOX_PASSWORD, and repacks platform clients — each with the
  # server config embedded — into ./velociraptor/clients/.
  #
  # The Windows VMs install velociraptor_client_repacked.exe as a service so they
  # auto-enroll as agents pointing at https://HOST_IP:8000/.
  #
  # NOTE: the datastore uses a NAMED volume, not a bind mount under /vagrant —
  # Docker can't chown a bind-mount source on the VMware HGFS shared folder
  # ("operation not permitted"). setup.sh instead `docker cp`s the repacked
  # Windows client out to docker/velociraptor/clients/windows/ on the synced
  # folder, where the Windows VMs read it as
  # C:\vagrant\docker\velociraptor\clients\windows\ (scripts/install_velociraptor_client.ps1).
  velociraptor:
    image: wlambert/velociraptor
    container_name: velociraptor
    restart: unless-stopped
    environment:
      - VELOX_USER=${VELOX_USER:-admin}
      - VELOX_PASSWORD=${VELOX_PASSWORD:?VELOX_PASSWORD is required}
      - VELOX_ROLE=${VELOX_ROLE:-administrator}
      - VELOX_SERVER_URL=https://${HOST_IP}:8000/
      - VELOX_FRONTEND_HOSTNAME=${HOST_IP}
    ports:
      - "8000:8000"   # client comms
      - "8001:8001"   # gRPC API
      - "8889:8889"   # Web GUI (https)
    volumes:
      - velociraptor_data:/velociraptor
    networks:
      hunt_net:
        ipv4_address: 172.20.0.50
